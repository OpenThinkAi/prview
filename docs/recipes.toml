# What a reviewer asks, mapped to the actions that answer it. Docs search embeds each phrasing; the hits are these actions.
# q       = phrasings of the question (2-4 each); each is indexed separately
# actions = action ids from src/keys.ts, in the order you would use them
# why     = one line: how it works, or the nearest alternative
# Name actions, never keys: bindings are remappable, so a key written here would go stale. No question marks or
# brackets either; those are keys too. A test checks every action is covered and every id exists.

# ---- moving in the code

[[recipe]]
q = ["how do I move down a line", "scroll down the diff", "go to the next line", "show the next piece of the diff"]
actions = ["code.down"]
why = "Moves the cursor down one line; at the end of a block it runs on into the next block in reading order."

[[recipe]]
q = ["how do I move up a line", "scroll back up the diff", "go to the previous line", "step back to the block before"]
actions = ["code.up"]
why = "Moves the cursor up one line; at the start of a block it runs on into the previous one."

[[recipe]]
q = ["how do I skip to the next chapter", "jump past this group of changes", "move on to the next topic in the review"]
actions = ["code.next_chapter", "toc.next_chapter"]
why = "Lands on the first block of the next chapter; the rest of this one stays unread."

[[recipe]]
q = ["how do I go back to the previous chapter", "return to the last group of changes", "step back a chapter"]
actions = ["code.prev_chapter", "toc.prev_chapter"]
why = "Lands on the first block of the previous chapter."

[[recipe]]
q = ["how do I open the finding on this line", "is there a finding where I am", "look at the problem under my cursor"]
actions = ["code.open_finding"]
why = "Opens the finding on the cursor line; the go to prefix finds the next one anywhere."

[[recipe]]
q = ["why is this chapter here", "what should I check in this chapter", "go back to the table of contents", "what is this group of changes for"]
actions = ["code.to_toc"]
why = "Goes back out of the code to the table of contents at this block; the content area shows the chapter's intent and why."

# ---- the table of contents

[[recipe]]
q = ["how do I move through the table of contents", "go to the next block in the contents", "pick another block from the list of chapters"]
actions = ["toc.down", "toc.up"]
why = "Moves block by block through the table of contents; a collapsed chapter is one stop, its blocks skipped."

[[recipe]]
q = ["how do I expand a chapter", "open a chapter in the contents", "enter the code of this block"]
actions = ["toc.expand"]
why = "Expands a collapsed chapter, or on a block moves into its code; the other arrow comes back out."

[[recipe]]
q = ["how do I collapse a chapter", "fold a chapter away in the contents", "hide the blocks of a chapter"]
actions = ["toc.collapse"]
why = "Collapses the chapter under the cursor in the table of contents; on a block it first goes up to the chapter."

# ---- the content area

[[recipe]]
q = ["how do I scroll the content area", "read the rest of a long answer", "move into the panel at the bottom", "the summary is cut off"]
actions = ["code.focus_content", "toc.focus_content", "finding.focus_content", "content.down", "content.up"]
why = "Moves focus into the content area, where the arrows scroll it; the same key or Esc comes back to where you were."

[[recipe]]
q = ["how do I page through a long answer", "jump a screen at a time in the content area", "page down the text in the panel"]
actions = ["content.page_down", "content.page_up"]
why = "With focus in the content area, pages it a screen at a time."

[[recipe]]
q = ["how do I leave the content area", "go back to the code from the panel", "stop scrolling the answer"]
actions = ["content.back"]
why = "Moves focus back out of the content area, to the open finding, the code or the table of contents; Esc does the same."

[[recipe]]
q = ["how do I copy the text of the content area", "copy what the panel says", "grab the summary text", "copy a search result"]
actions = ["review.copy", "content.copy"]
why = "Copies the content area's own text, or the selected search result; with nothing there, the cursor line's path and line."

# ---- going to things

[[recipe]]
q = ["how do I jump to the next finding", "find the next problem in the review", "go to the next issue the model raised", "show me the next finding"]
actions = ["go.next_finding"]
why = "Goes to the next finding anywhere in the review and opens it, wrapping round at the end."

[[recipe]]
q = ["how do I go back to the previous finding", "return to the last finding", "show me the finding before this one"]
actions = ["go.prev_finding"]
why = "Goes to the previous finding anywhere in the review, wrapping round at the start."

[[recipe]]
q = ["how do I see the worst findings first", "go to the most serious problem", "step through findings by severity"]
actions = ["go.next_severity", "go.prev_severity"]
why = "Walks every high finding in reading order, then the medium ones, then the low ones."

[[recipe]]
q = ["how do I go to the top of the file", "jump to the start of this file", "go to the end of the file", "jump to the bottom of this file"]
actions = ["go.top", "go.end"]
why = "Goes to the first line of the file's first block, or the last line of its last block."

[[recipe]]
q = ["how do I go to a line number", "jump to line 120 of this file", "take me to a specific line"]
actions = ["go.line"]
why = "Type the number after the go to prefix and confirm; a line not in the diff lands on the nearest one shown."

[[recipe]]
q = ["how do I go to a chapter by number", "jump to chapter 3", "open a chapter directly"]
actions = ["go.chapter"]
why = "Type the chapter's number and confirm; you land on its first block."

[[recipe]]
q = ["did the author answer my comments from last time", "what happened to the comments I posted before", "show the replies to my earlier review", "were my previous comments addressed or resolved"]
actions = ["go.previous"]
why = "In a re-review, goes to the chapter of what your last submit posted: each item's status (unchanged, line changed, moved, file removed), the replies and whether its thread is resolved."

[[recipe]]
q = ["how do I answer the author's reply to my comment", "respond to a thread from my last review", "write back on an earlier comment thread", "reply to the author on my old comment"]
actions = ["review.reply"]
why = "In a re-review, on one of your previous comments: writes a reply in your own words, queued and sent with your next submit before the new review; using it again edits it."

[[recipe]]
q = ["how do I resolve my earlier comment", "mark a thread as resolved now that it is fixed", "close the conversation on my old comment", "the author fixed it, resolve the thread"]
actions = ["review.resolve"]
why = "In a re-review, on one of your previous comments: marks its thread resolved (fixed on Azure DevOps) with your next submit, before the new review; using it again undoes it."

# ---- filters

[[recipe]]
q = ["how do I show only the serious findings", "hide the minor findings", "filter findings by severity", "show every finding again"]
actions = ["filter.high", "filter.medium", "filter.all"]
why = "Shows only high findings, high and medium, or all of them; the filter is for reading, not for what gets posted."

# ---- view

[[recipe]]
q = ["how do I wrap long lines", "stop lines running off the edge", "turn line wrapping on or off", "a line is cut off on the right side"]
actions = ["view.wrap"]
why = "Toggles wrapping long lines onto more rows; unwrapped lines are cut with an ellipsis."

[[recipe]]
q = ["how do I hide the table of contents", "give the code the whole width", "zen mode"]
actions = ["view.zen"]
why = "Hides or shows the table of contents so the code has the room."

[[recipe]]
q = ["what changed since my last review", "show only the new changes after the author pushed again", "re-review only what is different since I submitted", "see the whole pull request again"]
actions = ["view.since"]
why = "In a re-review, shows only the blocks changed since the head you last submitted on (marked with a dot), or the whole PR again."

[[recipe]]
q = ["how do I make the content area full screen", "read an answer with the whole screen", "enlarge the panel"]
actions = ["view.fullscreen"]
why = "Makes the content area full-screen; Esc or the same key restores it."

[[recipe]]
q = ["how do I open the file in my editor", "edit the file I am reviewing", "jump from the diff into the source", "see more of the file than the diff shows"]
actions = ["code.down", "view.editor"]
why = "Move to the line, then open the editor on the file at that line; quitting it brings you back here."

# ---- AI

[[recipe]]
q = ["how do I see the summary again", "where did the overview go", "bring back the summary of this change", "who prepared this review"]
actions = ["ai.info"]
why = "Shows the summary the review opened with: the overview, any suggested verdicts and who prepared it."

[[recipe]]
q = ["how do I ask a question about this code", "ask the model about the block I am on", "what does this change do", "ask the model about this finding"]
actions = ["ai.ask"]
why = "Asks the agent about the block under the cursor, the chapter in the table of contents or the open finding; it reads the code (read-only) to answer, cites path:line, and a follow-up keeps the conversation."

[[recipe]]
q = ["dig into the code with an agent", "ask about this whole chapter", "ask a follow-up question", "check whether this finding holds elsewhere in the code"]
actions = ["ai.ask"]
why = "The agent can open files and search the repository at the change's head (read-only), so it can follow callers and tests; a follow-up keeps the conversation for that block, chapter or finding."

[[recipe]]
q = ["can the model draft my review", "suggest which findings to post and a verdict", "write a draft submission for me"]
actions = ["ai.draft"]
why = "The model proposes the findings to include, a verdict and a comment; nothing is sent until you send it."

[[recipe]]
q = ["how do I accept the model's answer about a finding", "update the finding from the answer", "throw away the model's answer", "keep the finding as it was"]
actions = ["ai.accept", "ai.discard"]
why = "After asking about a finding, accept the answer to apply the change it proposes (severity, title, claim or ignore), or discard it to leave the finding alone. These keys appear only while an answer is waiting."

# ---- the action on a finding: block, comment or ignore

[[recipe]]
q = ["how do I say this finding is wrong", "ignore a finding that is not a real problem", "mark a finding as a false alarm", "reject the model's finding"]
actions = ["finding.ignore"]
why = "Sets the finding's action to ignore, with an optional private note that is never posted; nothing is posted for it."

[[recipe]]
q = ["how do I block the pull request on a finding", "request changes over this problem", "say this must be fixed before merge"]
actions = ["finding.block"]
why = "Sets the finding's action to block: a comment that requests changes, prefilled with its text; the verdict follows at submit."

[[recipe]]
q = ["how do I change my mind about a finding", "undo what I did to a finding", "change the action on a finding", "edit the comment I wrote on a finding"]
actions = ["finding.block", "finding.comment", "finding.ignore"]
why = "Choose block, comment or ignore again: it replaces the action, and block or comment opens the comment you wrote to edit. There is no separate undo."

[[recipe]]
q = ["why does this finding already say block", "what does default mean on a finding", "change the default action for high findings", "which findings start as ignored"]
actions = ["finding.block", "finding.comment", "finding.ignore", "review.settings"]
why = "Every finding starts on its severity's default action (high blocks, medium and low comment; [defaults] in the config changes it), marked default until you pick one."

[[recipe]]
q = ["where did the withdrawn findings go", "show the findings the second look dropped", "see findings the refute step rejected"]
actions = ["go.next_finding", "code.open_finding"]
why = "Findings the second look dropped are shown like any other, ignored by default, with its reason in their detail; block or comment one to keep it."

[[recipe]]
q = ["how do I post a finding as a comment", "reply to a finding without blocking", "leave a comment on the pull request about this finding", "respond to a finding with a remark that does not hold up the merge"]
actions = ["go.next_finding", "finding.comment", "review.submit"]
why = "Open the finding, choose comment and word it yourself; choosing it again edits what you wrote. It posts under your name when you submit."

[[recipe]]
q = ["how do I close a finding", "put a finding away for later", "close the popup", "go back to the code from a finding"]
actions = ["finding.close", "finding.back"]
why = "Closes the finding; its action stays as it is. Esc does the same."

[[recipe]]
q = ["how do I copy a finding", "put a finding on the clipboard", "copy the text of a problem to paste elsewhere"]
actions = ["code.open_finding", "finding.copy"]
why = "Open the finding, then copy: its text goes to the clipboard."

[[recipe]]
q = ["how do I scroll a long finding", "read the rest of the finding", "page through the finding's evidence"]
actions = ["finding.page_down", "finding.page_up", "finding.focus_content"]
why = "Pages the open finding's text a screen at a time; Tab moves focus into it to scroll line by line, and Tab or Esc comes back with the finding still open."

# ---- triaging a whole review

[[recipe]]
q = ["how do I go through all the findings", "triage the findings in this review", "decide what to do with every finding", "work through the problems the model raised"]
actions = ["filter.high", "go.next_severity", "finding.block", "finding.comment", "finding.ignore"]
why = "Show only the high findings, walk them with next by severity, and on each choose block, comment or ignore; then widen the filter. Whatever you leave keeps its default action."

# ---- your own findings

[[recipe]]
q = ["how do I leave a comment on a line", "write my own note on this code", "add my own finding on this line"]
actions = ["code.new_finding"]
why = "Writes a finding of your own on the cursor line: pick a severity, then the comment. It is posted as your own words at submit."

[[recipe]]
q = ["how do I comment on a whole file", "leave a comment about the file rather than a line", "write a remark that is about the file as a whole"]
actions = ["go.top", "go.end", "code.new_finding"]
why = "Each file's diff starts and ends with a whole-file row; go to the top or end of the file, then write a finding there. It posts as a file comment just before the review is submitted."

[[recipe]]
q = ["how do I delete my old comment", "remove a comment carried over from the last round", "my comment from before should not be posted again"]
actions = ["code.delete_comment"]
why = "On a line with a comment of yours that no finding owns (carried over when the head moved, say), deletes it so it is not posted. The submit checklist lists such comments too, to untick instead."

# ---- help and settings

[[recipe]]
q = ["how do I search these docs", "ask a question about how to use prview", "find the action for what I want to do", "look up a shortcut in my own words"]
actions = ["review.search_docs"]
why = "Type a question and see the matching actions with your current keys; it runs offline and calls no model. To question the model about the code, use the ask action."

[[recipe]]
q = ["how do I change a key binding", "open the settings", "change the default models or editor", "turn wrap or blind on by default"]
actions = ["review.settings"]
why = "Opens the settings view: every action's primary and secondary key, the default action per severity, the model per role, the editor and the display defaults. Enter edits a field, Esc leaves and offers to save to the config file; saved changes apply at once."

# ---- finishing

[[recipe]]
q = ["how do I submit a review", "send my review to GitHub", "approve the pull request", "request changes on the pull request"]
actions = ["review.submit"]
why = "Tick the findings to post, pick a verdict, write the top-level comment, read exactly what posts, then send; the review file is written first."

[[recipe]]
q = ["write a summary comment for the whole review", "leave a general comment on the pull request", "add a top-level review comment"]
actions = ["review.submit"]
why = "The top-level comment is the third step of submit: several lines, or v e to write it in your editor."

[[recipe]]
q = ["how do I quit", "leave the review for now", "stop reviewing without losing my work", "how do I resume a review later"]
actions = ["review.quit"]
why = "Leaves prview; every decision so far is saved, so opening the same review later picks up where you stopped."
